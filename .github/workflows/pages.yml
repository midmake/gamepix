name: Deploy MID GAMES to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Write exact GamePix 410E0 ads.txt
        shell: bash
        env:
          GAMEPIX_ADS_GZ_B64: 
        run: |
          printf '%s' "$GAMEPIX_ADS_GZ_B64" | base64 -d | gzip -d > site/ads.txt
          test "$(head -n 1 site/ads.txt)" = "#gpx-property-410E0"
          test "$(sha256sum site/ads.txt | awk '{print $1}')" = "6b72bda306baa03247215bd6f418a2b1e10fd37c980450eb6209822b35330e1c"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy MID GAMES to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Normalize and validate GamePix ads.txt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('site/ads.txt')
          text = p.read_text(encoding='utf-8')

          # Corrige a quebra de linha deformada na transferência do texto grande.
          text = text.replace('\\\tcontextweb.com, 562615, REVENDEDOR, 89ff185a4c4e857c', '\ncontextweb.com, 562615, REVENDEDOR, 89ff185a4c4e857c')

          # O navegador traduziu parcialmente os valores padronizados do ads.txt.
          # A especificação aceita DIRECT e RESELLER, não DIRETO/REVENDEDOR.
          text = text.replace(', DIRETO', ', DIRECT')
          text = text.replace(', REVENDEDOR', ', RESELLER')
          p.write_text(text, encoding='utf-8')

          lines = text.splitlines()
          assert len(lines) == 879, f'ads.txt: esperado 879 linhas, encontrado {len(lines)}'
          assert lines[0] == '#gpx-propriedade-9M27A'
          assert lines[1] == '#gpx-última-atualização-2024-11-21'
          assert lines[2] == '#gpx-reviq'
          assert lines[-1] == 'rubiconproject.com, 13380, RESELLER, 0bfd66d529a55807'
          assert 'DIRETO' not in text
          assert 'REVENDEDOR' not in text
          assert '\\\tcontextweb.com' not in text

          for number, line in enumerate(lines, start=1):
              row = line.strip()
              if not row or row.startswith('#'):
                  continue
              data = row.split('#', 1)[0].strip()
              fields = [part.strip() for part in data.split(',')]
              assert len(fields) >= 3, f'ads.txt linha {number}: formato inválido'
              assert fields[2] in {'DIRECT', 'RESELLER'}, f'ads.txt linha {number}: relação inválida {fields[2]!r}'

          print('ads.txt GamePix validado:', len(lines), 'linhas; DIRECT/RESELLER OK')
          PY

      - name: Upload public site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy MID GAMES to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Write exact GamePix ads.txt
        shell: bash
        env:
          GAMEPIX_ADS_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path

          data = gzip.decompress(base64.b64decode(os.environ['GAMEPIX_ADS_GZ_B64']))
          expected_sha256 = 'c10176dfb742166d1c24b5662df4080456c7d71f9371ac71a81661c05c8e2853'
          actual_sha256 = hashlib.sha256(data).hexdigest()
          assert actual_sha256 == expected_sha256, (actual_sha256, expected_sha256)

          text = data.decode('utf-8')
          lines = text.splitlines()
          assert len(lines) == 879
          assert lines[0] == '#gpx-property-9M27A'
          assert lines[1] == '#gpx-last-updated-2024-11-21'
          assert lines[2] == '#gpx-reviq'
          assert lines[-1] == 'rubiconproject.com, 13380, RESELLER, 0bfd66d529a55807'

          Path('site/ads.txt').write_bytes(data)
          print('Exact GamePix ads.txt written:', len(data), 'bytes; sha256', actual_sha256)
          PY

      - name: Upload public site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
